<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handcrafted Bouquets | Flower Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <section class="hero-section">
        <!-- Animated Background Elements -->
        <div class="floral-animation-container" id="animationContainer">
            <!-- SVG Petals will be injected by JavaScript -->
        </div>

        <!-- Centered Inner Content Box -->
        <div class="hero-content-box">
            <div class="hero-text-content">
                <h1 class="hero-heading">Handcrafted<br>Bouquets for<br>Every Emotion</h1>
                <p class="hero-subtext">Fresh flowers designed with elegance,<br>care, and a touch of love.</p>
                <button class="hero-btn" id="shopBtn">
                    <span class="btn-text">Shop Bouquets</span>
                    <span class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </span>
                    <span class="btn-hover-effect"></span>
                </button>
            </div>
            <div class="hero-image-content">
                <img src="bouquet2.png" alt="Purple Flower Bouquet" class="bouquet-image">
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
